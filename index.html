    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('llm-sdk-theme-v2');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'obsidian-dark' : 'editorial-light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'obsidian-dark' || theme === 'nordic-dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
